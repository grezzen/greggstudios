<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gregg Studios | True Hemp Creations Catalog</title>

    <link rel="icon" type="image/png" href="../favicon.png">

    <style>

        /* ==================================================
           RESET
           ================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            background: #000000;
            color: #ffffff;

            overflow-x: hidden;
        }


        /* ==================================================
           HEADER
           ================================================== */

        .top-header {
            width: 100%;
            min-height: 76px;

            display: flex;
            align-items: flex-start;
            justify-content: center;

            background: #000000;
        }

        .header-button {
            width: 380px;

            text-align: center;

            padding: 5px 20px 10px;
        }

        .header-home {
            color: #ffffff;
            text-decoration: none;
        }

        .header-main {
            font-size: 27px;
            font-weight: 400;
            line-height: 1.28;
        }

        .header-project {
            font-size: 20px;
            line-height: 1.4;
        }

        .header-back {
            display: block;

            color: #ffffff;
            text-decoration: none;

            font-size: 14px;
            line-height: 1.45;

            margin-top: 2px;
        }


        /* ==================================================
           VIEWER AREA
           ================================================== */

        .viewer-page {
            width: 100%;

            min-height: calc(100vh - 76px);

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 18px 24px 28px;
        }

        .viewer-wrap {
            width: min(950px, 92vw);

            height: calc(100vh - 145px);
            min-height: 650px;

            background: #ffffff;

            overflow: hidden;
        }

        .pdf-viewer {
            width: 100%;
            height: 100%;

            border: 0;

            display: block;
        }


        /* ==================================================
           BACK BUTTON
           ================================================== */

        .bottom-button-wrap {
            width: 100%;

            display: flex;
            justify-content: center;

            margin-top: 18px;
        }

        .bottom-button {
            min-width: 280px;

            background: #ffffff;
            color: #000000;

            text-decoration: none;
            text-align: center;

            font-size: 14px;
            font-weight: 700;

            padding: 13px 25px;

            transition:
                background-color 0.2s ease,
                transform 0.2s ease;
        }

        .bottom-button:hover {
            background: #dddddd;
            transform: translateY(-2px);
        }


        /* ==================================================
           MOBILE
           ================================================== */

        @media (max-width: 600px) {

            .top-header {
                min-height: 70px;
            }

            .header-main {
                font-size: 24px;
            }

            .header-project {
                font-size: 18px;
            }

            .viewer-page {
                padding: 0;
            }

            .viewer-wrap {
                width: 100%;

                height: calc(100vh - 70px);
                min-height: 0;
            }

            .bottom-button-wrap {
                display: none;
            }

        }

    </style>

</head>


<body>


    <!-- ==================================================
         HEADER
         ================================================== -->

    <header class="top-header">

        <div class="header-button">

            <a
                href="../index.html"
                class="header-home"
            >

                <div class="header-main">
                    GREGG STUDIOS
                </div>

            </a>

            <div class="header-project">
                TRUE HEMP CREATIONS CATALOG
            </div>

            <a
                href="true-hemp-creations.html"
                class="header-back"
            >
                [ BACK TO PROJECT ]
            </a>

        </div>

    </header>


    <!-- ==================================================
         PDF VIEWER
         ================================================== -->

    <main class="viewer-page">

        <div class="viewer-wrap">

            <iframe
                class="pdf-viewer"
                src="../assets/projects/true-hemp-creations/THC%20Catalog%202026.pdf#view=FitH"
                title="True Hemp Creations 2026 Catalog"
            >
            </iframe>

        </div>


        <div class="bottom-button-wrap">

            <a
                href="true-hemp-creations.html"
                class="bottom-button"
            >
                BACK TO TRUE HEMP CREATIONS
            </a>

        </div>

    </main>


</body>

</html>
